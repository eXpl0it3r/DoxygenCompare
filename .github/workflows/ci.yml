name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

defaults:
    run:
        shell: bash

env:
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
    DOTNET_NOLOGO: true
    DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
    build:
        name: ${{ matrix.platform.name }} ${{ matrix.dotnet.name }}
        runs-on: ${{ matrix.platform.os }}

        strategy:
            fail-fast: false
            matrix:
                platform:
                    - { name: Linux, os: ubuntu-26.04, rid: linux-x64 }
                    - { name: Windows, os: windows-2025, rid: win-x64 }
                    - { name: macOS, os: macos-26, rid: osx-arm64 }
                dotnet:
                    - { name: .NET 8, version: "8.0.x", dir: net8.0 }

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - name: Setup .NET ${{ matrix.dotnet.version }} SDK
              id: setup-dotnet
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: ${{ matrix.dotnet.version }}
            - name: Enforce SDK Version
              env:
                  DOTNET_VERSION: ${{ steps.setup-dotnet.outputs.dotnet-version }}
              run: dotnet new globaljson --sdk-version "$DOTNET_VERSION" --force
            - name: Verify SDK Installation
              run: dotnet --info
            - name: Install Dependencies
              run: dotnet restore
            - name: Build
              run: dotnet build --configuration Release --no-restore
            - name: Test
              run: dotnet test --no-build --configuration Release --verbosity normal
            - name: Publish
              env:
                  RID: ${{ matrix.platform.rid }}
              run: dotnet publish DoxygenCompare/DoxygenCompare.csproj --runtime "$RID" --self-contained --configuration Release -p:PublishReadyToRun=true -p:PublishSingleFile=true -p:PublishTrimmed=true -p:IncludeNativeLibrariesForSelfExtract=true
            - name: Upload Artifact
              uses: actions/upload-artifact@v7
              with:
                  name: DoxygenCompare-${{ matrix.platform.rid }}
                  path: ./DoxygenCompare/bin/Release/${{ matrix.dotnet.dir }}/${{ matrix.platform.rid }}/publish
